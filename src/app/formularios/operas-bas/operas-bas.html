<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <form>
                <div class="form-group pt-4">
                    <label for="num1">Número 1:</label>
                    <input [(ngModel)]="num1" name="num1" type="text" class="form-control" id="num1" placeholder="Ingrese número 1">
                </div>
                <div class="form-group pt-4">
                    <label for="num2">Número 2:</label>
                    <input [(ngModel)]="num2" name="num2" type="text" class="form-control" id="num2" placeholder="Ingrese número 2">
                </div>
                <br>
                <!-- <button (click)="sumar()" type="button" class="btn btn-primary">
                    Sumar
                </button>
                <br>
                <br>
                <button (click)="restar()" type="button" class="btn btn-primary">
                    Restar
                </button>
                <br>
                <br>
                <button (click)="multiplicacion()" type="button" class="btn btn-primary">
                    Multiplicar
                </button>
                <br>
                <br>
                <button (click)="dividir()" type="button" class="btn btn-primary">
                    Dividir
                </button>
                <br>
                <br>
                <button (click)="calcular()" type="button" class="btn btn-primary"></button> -->
                <div class="form-group pt-4">
                    <label>Selecciona la operación:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" [(ngModel)]="tipoOperacion" value="sumar" id="opSuma">
                        <label class="form-check-label" for="opSuma">Sumar +</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" [(ngModel)]="tipoOperacion" value="restar" id="opResta">
                        <label class="form-check-label" for="opResta">Restar -</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" [(ngModel)]="tipoOperacion" value="multiplicar" id="opMulti">
                        <label class="form-check-label" for="opMulti">Multiplicar *</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="operacion" [(ngModel)]="tipoOperacion" value="dividir" id="opDiv">
                        <label class="form-check-label" for="opDiv">Dividir /</label>
                    </div>
                </div>

                <br>
                <button (click)="calcular()" type="button" class="btn btn-primary">
                    Calcular
                </button>

            </form>
            </div>
            <div class="col-6">

                <h2>Resultado: {{resultado}}</h2>
            </div>
        </div>
    </div>
</body>
</html>
