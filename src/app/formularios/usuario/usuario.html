<div class="container">

  <div class="row">

    <div class="col-6">

      <h2 class="pt-4">Inicio de sesión</h2>

      <div class="form-group pt-3">

        <label>Usuario:</label>

        <input
          [(ngModel)]="usuario"
          name="usuario"
          type="text"
          class="form-control"
          placeholder="Ingrese el usuario">

      </div>

      <div class="form-group pt-3">

        <label>Contraseña:</label>

        <input
          [(ngModel)]="contrasena"
          name="contrasena"
          type="password"
          class="form-control"
          placeholder="Ingrese la contraseña">

      </div>

      <br>

      <button
        (click)="validarUsuario()"
        type="button"
        class="btn btn-primary">

        Iniciar sesión

      </button>

    </div>


    <div class="col-6 pt-4">

      <h3>{{ mensaje }}</h3>

    </div>

  </div>

</div>
